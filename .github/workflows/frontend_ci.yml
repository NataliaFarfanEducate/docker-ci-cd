name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend_test/**'
      - '.github/workflows/frontend_ci.yml'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-html:latest ./frontend_test

      - name: Validar configuración de nginx
        run: docker run --rm --add-host backend:127.0.0.1 ${{ secrets.DOCKER_USERNAME }}/frontend-html:latest nginx -t

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publicar imagen en Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend-html:latest

  deploy-frontend:
    needs: build-frontend
    runs-on: self-hosted
    steps:
      - name: Actualizar contenedor frontend
        shell: powershell
        run: | 
          cd C:\Users\loqin\Desktop\universidad\segundo_trimestre\despliegues_continuos\proyecto_docker_compose_limpio
          docker compose pull frontend
          docker compose up -d frontend